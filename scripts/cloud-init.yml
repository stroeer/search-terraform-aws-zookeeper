#cloud-config

package_update: true
package_upgrade: true

packages:
  - jq
  - java-11-amazon-corretto-headless
  - nc

mounts:
  - [ xvdb, /zookeeper/data, "xfs", "defaults,noatime", "0", "0" ]
  - [ xvdc, /zookeeper/logs, "xfs", "defaults,noatime", "0", "0" ]

write_files:
  - content: |
      #!/bin/bash

      touch /etc/sudoers.d/search-team
      chmod 440 /etc/sudoers.d/search-team

      declare -A USERKEY

      USERKEY[ascholz]=""
      USERKEY[cstuemer]=""
      USERKEY[dklug]=""
      USERKEY[khoebold]=""
      USERKEY[ltischendorf]=""
      USERKEY[prieger]=""
      USERKEY[swindisch]=""
      USERKEY[jbajaryn]=""

      for user in "$${!USERKEY[@]}" ; do

        adduser $user

        usermod -a -G adm $user

        echo "$user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/search-team

        mkdir -p /home/$user/.ssh

        chown -R $user:$user /home/$user/.ssh
        chmod -R go-rx /home/$user/.ssh
      done
    owner: root:root
    path: /run/create-users.sh
    permissions: 0700
  - content: |
      * * * * * root /usr/local/bin/instance_healthcheck.sh

    owner: root:root
    path: /etc/cron.d/healthcheck
    permissions: 0644
  - content: |
      #!/bin/bash
      export TOKEN=`curl -s -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" "http://169.254.169.254/latest/api/token"`
      INSTANCE_ID=`curl -s -H "X-aws-ec2-metadata-token:$TOKEN" http://169.254.169.254/latest/meta-data/instance-id`
      REGION=`curl -s -H "X-aws-ec2-metadata-token:$TOKEN" http://169.254.169.254/latest/dynamic/instance-identity/document | jq -r .region`
      HEALTH=`echo ruok | nc localhost ${client_port}`
      if [[ $HEALTH == "imok" ]];
      then
        aws autoscaling set-instance-health --instance-id $INSTANCE_ID --health-status Healthy --region $REGION
      else
        aws autoscaling set-instance-health --instance-id $INSTANCE_ID --health-status Unhealthy --region $REGION
      fi

    owner: root:root
    path: /usr/local/bin/instance_healthcheck.sh
    permissions: 0700
  - content: |
      #!/bin/bash
      echo Creating zookeeper user and group

      adduser zookeeper -U -d /zookeeper -M
    path: /run/create_zk_user.sh
    permissions: 0700
  - content: |
      [Unit]
      Description=ZooKeeper Service
      Documentation=http://zookeeper.apache.org
      Requires=network.target
      After=network.target

      [Service]
      Type=forking
      User=zookeeper
      Group=zookeeper
      ExecStart=/zookeeper/bin/zkServer.sh start /zookeeper/conf/zoo.cfg
      ExecStop=/zookeeper/bin/zkServer.sh stop /zookeeper/conf/zoo.cfg
      ExecReload=/zookeeper/bin/zkServer.sh restart /zookeeper/conf/zoo.cfg
      WorkingDirectory=/zookeeper
      Environment=ZK_SERVER_HEAP=${zk_heap}

      [Install]
      WantedBy=default.target
    path: /run/zookeeper.service
    permissions: 0600
  - content: |
      tickTime=${tick_time}
      initLimit=${init_limit}
      syncLimit=${sync_limit}
      dataDir=/zookeeper/data
      dataLogDir=/zookeeper/logs
      clientPort=${client_port}
      4lw.commands.whitelist=mntr, stat, ruok, conf, isro
      maxClientCnxns=600
      %{ for node in nodes ~}
        server.${node}=${subdomain}-${node}.${domain}:2888:3888
      %{ endfor ~}

    path: /run/zoo.cfg
    permissions: 0600
  - content: |
      #!/bin/bash
      echo Configuring data and log volume storage

      mkfs.xfs /dev/xvdb
      mkfs.xfs /dev/xvdc

      mount -a

    path: /run/setup_volumes.sh
    permissions: 0700
  - content: |
      #!/bin/bash
      echo Installing Zookeeper v${version}
      wget -O /run/zk.tgz https://archive.apache.org/dist/zookeeper/zookeeper-${version}/apache-zookeeper-${version}-bin.tar.gz
      tar zxvf /run/zk.tgz --strip 1 -C /zookeeper
      echo ${index} > /zookeeper/data/myid
      cp /run/zoo.cfg /zookeeper/conf/zoo.cfg
      cp /run/zookeeper.service /usr/lib/systemd/system/zookeeper.service && chmod 0644 /usr/lib/systemd/system/zookeeper.service
      systemctl daemon-reload
      chkconfig zookeeper on

      chown -R zookeeper:zookeeper /zookeeper
    path: /run/install_zookeeper.sh
    permissions: 0700
  - content: |
      {
        "log_file": "/zookeeper/logs/zookeeper-zookeeper*",
        "log_group": "zookeeper.log",
        "log_stream": "",
        "timestamp_layout": "Jan 02 15:04:05",
        "timestamp_regex": "^(\\w{3} \\d{1,2} \\d{2}:\\d{2}:\\d{2})",
        "region": "eu-central-1",
        "imdsv2": true,
        "batch_max_size": 100,
        "flush_interval_ms": 500,
        "create_log_group": true,
        "create_log_stream": true
      }
    path: /etc/aws-ec2logshipper/config.json
    permissions: 0755
  - content: |
      #!/bin/bash
      echo Installing v${logshipper_version} EC2 Logshipper by ESEMOS
      wget -O /run/aws-ec2logshipper.rpm https://github.com/esemossearch/aws-ec2logshipper/releases/download/v${logshipper_version}/aws-ec2logshipper-${logshipper_version}-1.x86_64.rpm
      rpm -Uvh /run/aws-ec2logshipper.rpm
      chkconfig aws-ec2logshipper on
      service aws-ec2logshipper start
    path: /run/install_aws-ec2logshipper.sh
    permissions: 0700

  - content: |
      #!/bin/bash
      yum install -y https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm
      service amazon-ssm-agent enabled
      service amazon-ssm-agent restart
    path: /run/install-ssm-agent.sh
    permissions: 0700

  - content: |
      #!/bin/bash
      needs-restarting -r
      if [ $$? -eq 1 ]; then
        reboot
      fi
    path: /run/reboot-required.sh
    permissions: 0700

runcmd:
  - yum update -y
  - /run/create-users.sh
  - /run/create_zk_user.sh
  - /run/setup_volumes.sh
  - /run/install_zookeeper.sh
  - /run/install_aws-ec2logshipper.sh
  - service zookeeper start
  - /run/install-ssm-agent.sh
  - /run/reboot-required.sh
  
